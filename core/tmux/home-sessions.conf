# Home-only optional session adapters. Bounded native navigation is configured
# separately in local-sessions.conf.

# Manual tmux-resurrect is supported when the operator installs it. Process
# restoration is explicitly disabled so agent, server, and privileged commands
# are never relaunched from a saved layout.
set -g @resurrect-processes 'false'
if-shell "test -r $HOME/.tmux/plugins/tmux-resurrect/resurrect.tmux" "run-shell $HOME/.tmux/plugins/tmux-resurrect/resurrect.tmux"
